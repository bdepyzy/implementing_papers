[project]
name = "paper-index"
version = "0.1.0"
description = "Save web pages and PDFs, highlight them, take notes, and search them later."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8.1",
    "pypdf>=4.0",
    "numpy>=1.26",
    "model2vec>=0.3",
]

[project.scripts]
paper-index = "paper_index.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
